<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="design-system/truemeds.css">
<script src="design-system/icons/icons.js"></script>
<style>
  html,body{margin:0;height:100%}
  body.tm{background:var(--tm-surface-primary)}
  .screen{height:100dvh;display:flex;flex-direction:column;padding:var(--tm-space-xl) var(--tm-space-lg) 0;box-sizing:border-box;position:relative;overflow:hidden}
  .logo{width:168px;height:auto}
  .head{margin-top:56px;display:flex;flex-direction:column;gap:var(--tm-space-sm)}
  .head h1{margin:0;font-size:24px;line-height:32px;font-weight:var(--tm-font-weight-semibold);color:var(--tm-content-primary)}
  .head p{margin:0;font-size:var(--tm-font-size-body-lg);line-height:var(--tm-font-lineheight-md);color:var(--tm-content-secondary)}
  .form{margin-top:var(--tm-space-2xl);display:flex;flex-direction:column;gap:var(--tm-space-lg)}
  .tm-field__prefix{flex-shrink:0;padding-right:var(--tm-space-sm);border-right:1px solid var(--tm-border-default);font-weight:var(--tm-font-weight-semibold)}
  .tm-field__control input{font-size:var(--tm-font-size-body-lg)}
  .tm-field--error .tm-field__helper{color:var(--tm-content-error)}
  .tm-field.locked .tm-field__control{background:var(--tm-surface-secondary)}
  .tm-field.locked input{color:var(--tm-content-secondary)}
  .note{display:none}
  .note.show{display:flex}
  .note .tm-icon{flex-shrink:0;margin-top:1px}
  .note a{color:var(--tm-content-brand);font-weight:var(--tm-font-weight-semibold);text-decoration:none;white-space:nowrap}
  .tm-notice--info{background:var(--tm-surface-info-subtle);border-color:var(--tm-border-info-subtle)}
  .tm-notice--info .tm-icon{color:var(--tm-content-brand)}
  .foot{margin-top:auto;padding:var(--tm-space-lg) 0 var(--tm-space-xl);text-align:center;font-size:var(--tm-font-size-body-md);line-height:var(--tm-font-lineheight-sm);color:var(--tm-content-secondary)}
  .foot a{color:var(--tm-content-brand);font-weight:var(--tm-font-weight-semibold);text-decoration:none}
  .tm-btn.busy,.tm-btn.busy:disabled{background:var(--tm-surface-brand-default);color:#fff;opacity:.85;border-color:transparent}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;margin-right:8px;vertical-align:-3px}
  .kbd{position:absolute;left:0;right:0;bottom:0;height:300px;background:#d1d5db;display:none;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;box-sizing:border-box}
  .kbd div{background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font:500 22px/1 sans-serif;color:#111}
  body.kb .kbd{display:grid}
</style></head><body class="tm">
<div class="screen">
  <img class="logo" src="truemeds-for-doctors.svg" alt="Truemeds for doctors">
  <div class="head">
    <h1>Welcome, Doctor.</h1>
    <p id="sub">A different kind of house call.</p>
  </div>
  <div class="form">
    <div class="tm-field" id="f">
      <label class="tm-field__label" for="ph">Mobile number</label>
      <div class="tm-field__control"><span class="tm-field__prefix">+91</span><input id="ph" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="10-digit mobile number"></div>
      <div class="tm-field__helper" id="h">We'll send you a verification code by SMS.</div>
    </div>
    <div class="tm-notice note" id="n"><span class="tm-icon" id="ni" data-icon="info-circle"></span><div id="nt"></div></div>
    <button class="tm-btn tm-btn--lg tm-btn--primary tm-btn--block" id="b">Send OTP</button>
  </div>
  <div class="foot"><div>New to Truemeds? <a href="#">Sign up</a></div></div>
  <div class="kbd"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div></div><div>0</div><div>⌫</div></div>
</div>
<script>
function state(s){
  const $=id=>document.getElementById(id);
  const f=$('f'),h=$('h'),ph=$('ph'),b=$('b'),n=$('n');
  if(s.sub)$('sub').textContent=s.sub;
  if(s.v)ph.value=s.v;
  if(s.kb){document.body.classList.add('kb');ph.focus();}
  if(s.err){f.classList.add('tm-field--error');h.textContent=s.err;}
  if(s.note){ // system / account messages: replace the helper line, field stays neutral
    h.style.display='none';n.classList.add('show','tm-notice--'+s.note.k);
    $('ni').setAttribute('data-icon',s.note.i||'info-circle');$('nt').innerHTML=s.note.t;
    if(window.TMIcons)TMIcons.render(n);
  }
  if(s.kbbusy){document.body.classList.add('kb');}
  if(s.busy){b.innerHTML='<span class="spin"></span>Sending OTP';b.disabled=true;b.classList.add('busy');f.classList.add('locked');ph.readOnly=true;}
  if(s.btn){b.textContent=s.btn;b.disabled=true;}
}
</script></body></html>
