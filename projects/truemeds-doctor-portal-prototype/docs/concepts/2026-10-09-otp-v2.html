<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="design-system/truemeds.css"><link rel="stylesheet" href="_auth.css">
<script src="design-system/icons/icons.js"></script>
<style>
 .code input{text-align:center;font-size:20px;letter-spacing:.35em;height:56px}
 .code .tm-field__control{justify-content:center}
 .code input:placeholder-shown{letter-spacing:normal;font-size:var(--tm-font-size-body-lg)}
 .rs{display:flex;justify-content:space-between;font-size:var(--tm-font-size-body-md);color:var(--tm-content-secondary);margin-top:-4px}
 hr{border:0;border-top:1px solid var(--tm-border-subtle);margin:0}
 .terms{font-size:var(--tm-font-size-body-sm);line-height:var(--tm-font-lineheight-sm);color:var(--tm-content-secondary)}
 .terms a{color:var(--tm-content-primary);text-decoration:underline}
 .stack{display:flex;flex-direction:column;gap:var(--tm-space-lg)}
 /* biometric row variants */
 .bio{display:flex;gap:12px;align-items:flex-start}
 .bio .t{font-size:var(--tm-font-size-body-lg);font-weight:var(--tm-font-weight-semibold);color:var(--tm-content-primary);line-height:24px}
 .bio .d{font-size:var(--tm-font-size-body-md);line-height:var(--tm-font-lineheight-sm);color:var(--tm-content-secondary);margin-top:2px}
 .cb{width:22px;height:22px;border:1.5px solid var(--tm-border-strong);border-radius:6px;flex-shrink:0;margin-top:1px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#fff}
 .cb.on{background:var(--tm-surface-brand-default);border-color:var(--tm-surface-brand-default);color:#fff}
 .cb.on .tm-icon{width:16px;height:16px}
 .ic{width:44px;height:44px;border-radius:12px;background:var(--tm-surface-brand-subtle);color:var(--tm-content-brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
 .ic .tm-icon,.ic svg{width:24px;height:24px}
 .bio.c{align-items:center}
 .bio.c .txt{flex:1}
 .bio-wrap.dv hr{display:none}
 .bio.d{border:1px solid var(--tm-border-default);border-radius:var(--tm-radius-lg);padding:14px;align-items:center}
 .bio.d.on{border-color:var(--tm-border-selected,var(--tm-surface-brand-default));background:var(--tm-surface-brand-subtle)}
 .bio.d.on .ic{background:#fff}
 .bio.d .txt{flex:1}
 .tm-field.locked .tm-field__control{background:var(--tm-surface-secondary)}
 .bio-wrap.hide{display:none}
 .code.tm-field--error .tm-field__helper{color:var(--tm-content-error)}
 .code .tm-field__helper.ok{color:var(--tm-content-success);display:flex;align-items:center;gap:6px}
 .code .tm-field__helper.ok .tm-icon{width:16px;height:16px}
 .code.locked .tm-field__control{background:var(--tm-surface-secondary)} .code.locked input{color:var(--tm-content-secondary)}
 .dim{opacity:.5;pointer-events:none}
 .rs a{color:var(--tm-content-brand);font-weight:var(--tm-font-weight-semibold);text-decoration:none}
 .tm-btn.busy,.tm-btn.busy:disabled{background:var(--tm-surface-brand-default);color:#fff;opacity:.85;border-color:transparent}
 .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;margin-right:8px;vertical-align:-3px}
 .bio-wrap.ev hr{display:none}
 label.bio.e{background:var(--tm-surface-secondary);border-radius:var(--tm-radius-lg);padding:var(--tm-space-md);align-items:center;cursor:pointer;min-height:72px;box-sizing:border-box}
 label.bio.e .ic{background:var(--tm-surface-primary)}
 label.bio.e .txt{flex:1}
</style></head><body class="tm">
<div class="screen">
 <div class="top">
  <div class="back"><span class="tm-icon" data-icon="arrow-left"></span>Back</div>
  <img class="logo" src="truemeds-for-doctors.svg" alt="Truemeds for doctors">
  <div class="head" style="margin-top:28px"><h1>Verify your number</h1><p>Enter the OTP sent to<b>+91 98765 43210</b></p></div>
  <div style="margin-top:14px"><a class="lk" href="#">Change number</a></div>
 </div>
 <div class="panel"><div class="stack">
  <div class="tm-field code" id="f"><label class="tm-field__label">Verification code</label>
   <div class="tm-field__control"><input id="c" inputmode="numeric" maxlength="4" placeholder="4-digit OTP" autocomplete="one-time-code"></div>
   <div class="tm-field__helper" id="h" style="display:none"></div></div>
  <div class="tm-notice note" id="n"><span class="tm-icon" id="ni" data-icon="info-circle"></span><div id="nt"></div></div>
  <div class="rs" id="rs"><span>Didn’t receive it?</span><span id="rr">Resend in 00:30</span></div>
  <div class="bio-wrap" id="bw"><hr><div id="bio" style="padding:var(--tm-space-lg) 0"></div><hr></div>
  <div class="terms">By selecting Verify &amp; sign in, you agree to the <a href="#">Terms &amp; Conditions</a> and acknowledge the <a href="#">Privacy Policy</a>.</div>
  <button class="tm-btn tm-btn--lg tm-btn--primary tm-btn--block" id="b">Verify &amp; sign in</button>
 </div></div>
 <div class="sugg"><div>4827<small>From Messages</small></div></div>
 <div class="kbd"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div></div><div>0</div><div>⌫</div></div>
</div>
<script>
const FACE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8v-2a2 2 0 0 1 2 -2h2"/><path d="M4 16v2a2 2 0 0 0 2 2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M16 20h2a2 2 0 0 0 2 -2v-2"/><path d="M9 10l.01 0"/><path d="M15 10l.01 0"/><path d="M9.5 15a3.5 3.5 0 0 0 5 0"/></svg>';
function state(s){const $=id=>document.getElementById(id);
 const on=!!s.on, cb='<span class="cb'+(on?' on':'')+'">'+(on?'<span class="tm-icon" data-icon="check"></span>':'')+'</span>';
 const t='<div class="t">Sign in faster next time</div>', d='<div class="d">Use your device’s face, fingerprint, or screen lock.</div>';
 const ic='<span class="ic">'+(s.icon==='face'?FACE:'<span class="tm-icon" data-icon="fingerprint"></span>')+'</span>';
 const v=s.bio||'a', B=$('bio');
 if(v==='a')B.innerHTML='<div class="bio">'+cb+'<div>'+t+d+'</div></div>';
 if(v==='b')B.innerHTML='<div class="bio">'+cb+'<span class="tm-icon" data-icon="fingerprint" style="width:24px;height:24px;color:var(--tm-content-brand);flex-shrink:0"></span><div>'+t+d+'</div></div>';
 if(v==='c')B.innerHTML='<div class="bio c">'+ic+'<div class="txt">'+t+d+'</div>'+cb+'</div>';
 if(v==="d"){$("bw").classList.add("dv");B.style.padding="0";B.innerHTML='<div class="bio d'+(on?' on':'')+'">'+ic+'<div class="txt">'+t+d+'</div>'+cb+'</div>';}
 if(v==='e'){$('bw').classList.add('ev');B.style.padding='0';B.innerHTML='<label class="bio e">'+ic+'<div class="txt">'+t+d+'</div>'+cb+'</label>';}
 if(s.nobio)$('bw').classList.add('hide');
 if(s.v)$('c').value=s.v;
 if(s.kb){document.body.classList.add('kb');$('c').focus();} if(s.sg)document.body.classList.add('sg');
 const f=$('f'),h=$('h'),b=$('b');
 if(s.err){f.classList.add('tm-field--error');h.style.display='block';h.textContent=s.err;}
 if(s.ok){h.style.display='flex';h.className='tm-field__helper ok';h.innerHTML='<span class="tm-icon" data-icon="circle-check"></span>'+s.ok;}
 if(s.rr!==undefined)$('rr').innerHTML=s.rr;
 if(s.rl!==undefined)$('rs').firstElementChild.innerHTML=s.rl;
 if(s.norow)$('rs').style.display='none';
 if(s.note){const n=$('n');n.classList.add('show','tm-notice--'+s.note.k);$('ni').setAttribute('data-icon',s.note.i);$('nt').innerHTML=s.note.t;}
 if(s.busy){b.innerHTML='<span class="spin"></span>Verifying';b.disabled=true;b.classList.add('busy');f.classList.add('locked');$('bw').classList.add('dim');}
 if(s.lock){f.classList.add('locked');$('c').disabled=true;$('bw').classList.add('dim');b.disabled=true;}
 TMIcons.render(document);
}
</script></body></html>
