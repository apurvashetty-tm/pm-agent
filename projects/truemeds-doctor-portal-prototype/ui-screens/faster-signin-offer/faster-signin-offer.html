<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Truemeds for doctors — Skip OTPs next time</title>
<script>if(new URLSearchParams(location.search).has('capture'))document.documentElement.classList.add('capture')</script>
<link rel="stylesheet" href="../../../../design-system/truemeds.css">
<!-- 2026-11-11 (run r2-build, D-106–D-109): the approved reference uses the app's own screen styles, so the two can't drift:
     the one band and panel (D-107) and the offer's D-108 visible gaps (hero → 32 → points, 16 apart; semibold point titles). -->
<link rel="stylesheet" href="../../app/screens/band.css">
<link rel="stylesheet" href="../../app/screens/faster-signin-offer.css">
<style>
/* The reference page's own frame (not the screen): a 390 × 844 phone in review, the whole viewport in capture. */
html,body{margin:0}
[hidden]{display:none !important}   /* as the app shell (shell.css) */
body.tm{display:flex;flex-direction:column;align-items:center;background:var(--tm-surface-secondary)}
.screen{width:390px;height:844px;flex:none}
.review-controls{width:390px;margin:var(--tm-space-lg) auto;font-family:var(--tm-font);color:var(--tm-content-primary)}
.review-controls label{display:block;margin-bottom:var(--tm-space-xs)}
.review-controls select{width:100%;padding:var(--tm-space-sm);font:inherit;border:1px solid var(--tm-border-default);border-radius:var(--tm-radius-md);background:var(--tm-surface-primary)}
html.capture .review-controls{display:none}
html.capture body.tm{display:block;overflow:hidden;background:var(--tm-surface-primary)}
html.capture .screen{width:100vw;height:100vh}
</style>
<script src="../../../../design-system/icons/icons.js"></script>
<script src="../feedback/messages.js"></script>
</head><body class="tm">
<div class="review-controls"><label for="review-state">Reference state</label><select id="review-state" aria-label="Faster sign-in offer state"><option value="fingerprint">Shown, fingerprint</option><option value="face-id">Shown, Face ID</option><option value="enabling">Enabling (OS prompt pending)</option><option value="screen-lock">Shown, screen lock</option><option value="enable-failed">Enabling failed</option><option value="offline">Offline</option><option value="unavailable">Not available on this phone</option></select></div>
<section class="screen offer-screen tm" aria-labelledby="offer-title">
 <header class="entry-band band">
  <div class="entry-band__row"><img class="entry-band__logo login-logo" src="../../brand/truemeds-for-doctors.svg" alt="truemeds for doctors"></div>
  <h1 class="entry-band__title" id="offer-title"></h1>
  <p class="entry-band__sub sub" id="sub"></p>
 </header>
 <div class="entry-panel panel">
  <div class="hero-wrap"><div class="hero-ic" aria-hidden="true"><span class="tm-icon" id="hero-icon" data-icon="fingerprint"></span></div></div>
  <ul class="points">
   <li><span class="tm-icon" data-icon="circle-check" aria-hidden="true"></span><div class="pt-txt"><p class="pt-t" id="pt-t1"></p><p class="pt-d" id="pt-d1"></p></div></li>
   <li><span class="tm-icon" data-icon="lock" aria-hidden="true"></span><div class="pt-txt"><p class="pt-t" id="pt-t2"></p><p class="pt-d" id="pt-d2"></p></div></li>
   <li><span class="tm-icon" data-icon="settings" aria-hidden="true"></span><div class="pt-txt"><p class="pt-t" id="pt-t3"></p><p class="pt-d" id="pt-d3"></p></div></li>
  </ul>
 </div>
 <div class="tm-actionbar footer">
  <div class="tm-notice notice-slot" id="offer-notice" role="status" hidden><span class="tm-icon" data-icon="alert-circle" aria-hidden="true"></span><span id="offer-notice-text"></span></div>
  <button class="tm-btn tm-btn--primary tm-btn--lg tm-btn--block" id="turn-on" type="button"><span id="turn-on-label"></span></button>
  <button class="tm-btn tm-btn--quiet tm-btn--lg tm-btn--block" id="not-now" type="button"></button>
 </div>
</section>
<script>
// Device wording (D-45, D-64): never implies Truemeds stores biometrics. Copy from the registry (D-109: point 1 "Sign in with …").
const M=window.TMFeedback.msg;
const FP={icon:'fingerprint',sub:'offer.fingerprintSub',point:'offer.fingerprintPoint',trust:'offer.fingerprintTrust'};
const VARIANTS={
 fingerprint:FP,
 'face-id':{icon:'face-id',sub:'offer.faceIdSub',point:'offer.faceIdPoint',trust:'offer.faceIdTrust'},
 enabling:{...FP,enabling:true},
 'screen-lock':{icon:'lock',sub:'offer.screenLockSub',point:'offer.screenLockPoint',trust:'offer.screenLockTrust'},
 'enable-failed':{...FP,notice:['error','alert-circle','offer.enableFailed'],retry:true},
 offline:{...FP,notice:['warning','alert-triangle','offer.offline']},
 // D-93 (revised): the phone answered "unavailable" at Turn on. Screen unchanged; warning notice in the bar (unlock.unavailable),
 // the primary reads Continue (offer.continue) → Home, Not now hidden.
 unavailable:{...FP,notice:['warning','alert-triangle','unlock.unavailable'],unavailable:true}
};
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const key=params.get('capture')||params.get('state')||'fingerprint';
const v=VARIANTS[key]||VARIANTS.fingerprint;
const sel=$('review-state');
sel.value=key in VARIANTS?key:'fingerprint';
sel.addEventListener('change',()=>{location.search='?state='+encodeURIComponent(sel.value)});
$('offer-title').textContent=M('offer.title');
$('hero-icon').dataset.icon=v.icon;
$('sub').textContent=M(v.sub);
$('pt-t1').textContent=M(v.point); $('pt-d1').textContent=M('offer.pointNoWait');
$('pt-t2').textContent=M(v.trust); $('pt-d2').textContent=M('offer.pointStored');
$('pt-t3').textContent=M('offer.pointChange'); $('pt-d3').textContent=M('offer.pointChangeLine');
$('turn-on-label').textContent=M('offer.submit');
$('not-now').textContent=M('offer.notNow');
const turnOn=$('turn-on');
if(v.notice){const n=$('offer-notice');n.className='tm-notice notice-slot tm-notice--'+v.notice[0];n.hidden=false;n.querySelector('.tm-icon').dataset.icon=v.notice[1];$('offer-notice-text').textContent=M(v.notice[2]);}
if(v.unavailable){
 // D-93: one action left, so the primary reads Continue and Not now is hidden (one primary per context).
 $('turn-on-label').textContent=M('offer.continue');
 $('not-now').hidden=true;
}
if(v.retry){$('turn-on-label').textContent=M('offer.retry');}
if(v.enabling){
 // L2: loading primary = brand fill, white label and spinner (central .tm-btn--busy)
 turnOn.classList.add('tm-btn--busy');turnOn.setAttribute('aria-busy','true');turnOn.disabled=true;
 $('turn-on-label').replaceChildren(Object.assign(document.createElement('span'),{className:'tm-spinner'}),M('offer.submitBusy'));
 $('not-now').disabled=true;
}
// No Back: this screen follows sign-in, so there is nothing to go back to (D-47).
// Phone back gesture = Not now (native). Escape stands in for it in this reference.
// D-93: on unavailable Not now is hidden, so phone Back = Continue (the only action).
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const nn=$('not-now');if(v.unavailable)turnOn.click();else if(!nn.disabled)nn.click();});
TMIcons.render(document);
</script>
</body></html>
