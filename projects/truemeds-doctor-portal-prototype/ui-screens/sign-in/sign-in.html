<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truemeds for doctors — Sign in</title>
<script>if (new URLSearchParams(location.search).has('capture')) document.documentElement.classList.add('capture');</script>
<link rel="stylesheet" href="../../../../design-system/truemeds.css">
<!-- 2026-11-11 (run r2-build, D-106–D-109): the approved reference uses the app's own screen styles, so the two can't drift:
     the one band and panel (D-107), sign-in's D-108 visible gaps, and the drawn phone keyboard. -->
<link rel="stylesheet" href="../../app/screens/band.css">
<link rel="stylesheet" href="../../app/screens/sign-in.css">
<link rel="stylesheet" href="../../app/shell/mock-keyboard.css">
<style>
/* The reference page's own frame (not the screen): a 390 × 844 phone in review, the whole viewport in capture. */
html,body {margin:0;min-height:100%;}
body {background:var(--tm-surface-primary);}
[hidden] {display:none !important;}   /* as the app shell (shell.css) */
#doctor-login-preview {display:flex;justify-content:center;padding:24px 0;}
#doctor-login-preview .login-phone {width:min(390px,100%);height:844px;}
.review-controls {max-width:390px;margin:24px auto 0;font-family:var(--tm-font);color:var(--tm-content-primary);}
.review-controls label {display:block;margin-bottom:8px;}
.review-controls select {width:100%;height:44px;padding:0 12px;border:1px solid var(--tm-border-default);border-radius:var(--tm-radius-md);background:var(--tm-surface-primary);font:inherit;}
html.capture .review-controls {display:none;}
html.capture body {overflow:hidden;}
html.capture #doctor-login-preview {padding:0;display:block;}
html.capture #doctor-login-preview .login-phone {width:100vw;height:100vh;}
</style>
</head>
<body class="tm">
<div class="review-controls"><label for="state">Approved state</label><select id="state" aria-label="Approved sign-in state"><option value="default">Default</option><option value="keyboard-open">Keyboard open</option><option value="empty-tap">Empty tap</option><option value="too-short">Too short</option><option value="wrong-first-digit">Wrong first digit</option><option value="pasted-cleaned">Pasted, cleaned</option><option value="sending">Sending OTP</option><option value="not-registered">Not registered</option><option value="offline">Offline</option><option value="couldnt-send">Couldn’t send</option><option value="too-many-tries">Too many tries</option><option value="inactive">Inactive account</option></select></div>
<div id="doctor-login-preview">
    <section class="login-phone signin-screen tm" aria-labelledby="tm-login-title" data-keyboard="false">
      <div class="signin-scroll">
        <header class="entry-band band">
          <div class="entry-band__row"><img class="entry-band__logo login-logo" src="../../brand/truemeds-for-doctors.svg" alt="truemeds for doctors"></div>
          <h1 class="entry-band__title" id="tm-login-title">Welcome, Doctor</h1>
          <p class="entry-band__sub sub" id="tm-login-sub"></p>
        </header>
        <main class="entry-panel panel login-fields login-content">
          <div class="tm-field">
            <label class="tm-field__label" for="tm-login-mobile">Mobile number</label>
            <div class="tm-field__control">
              <span class="login-prefix">+91</span>
              <input id="tm-login-mobile" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="e.g. 98765 43210" aria-describedby="tm-login-helper">
            </div>
            <div id="tm-login-helper" class="tm-field__helper"></div>
            <div id="tm-login-not-registered-notice" class="tm-notice login-notice tm-notice--neutral" role="status" hidden><span class="tm-icon" data-icon="info-circle" aria-hidden="true"></span><span></span></div>
            <div id="tm-login-offline-notice" class="tm-notice login-notice tm-notice--warning" role="alert" hidden><span class="tm-icon" data-icon="alert-triangle" aria-hidden="true"></span><span></span></div>
            <div id="tm-login-couldnt-send-notice" class="tm-notice login-notice tm-notice--error" role="alert" hidden><span class="tm-icon" data-icon="alert-circle" aria-hidden="true"></span><span></span></div>
            <div id="tm-login-too-many-tries-notice" class="tm-notice login-notice tm-notice--warning" role="alert" hidden><span class="tm-icon" data-icon="clock" aria-hidden="true"></span><span></span></div>
            <div id="tm-login-inactive-notice" class="tm-notice login-notice tm-notice--error" role="alert" hidden><span class="tm-icon" data-icon="alert-circle" aria-hidden="true"></span><span></span></div>
          </div>
          <button class="tm-btn tm-btn--primary tm-btn--lg tm-btn--block login-submit" type="button"><span class="tm-spinner" aria-hidden="true" hidden></span><span class="login-submit-label">Send OTP</span></button>
          <div class="login-signup-row"><p class="login-signup" id="tm-signup-option"><a class="tm-link login-signup-label" href="#"></a></p></div>
        </main>
      </div>
      <div class="mock-kbd login-keyboard" aria-hidden="true"><div class="mock-kbd__key">1</div><div class="mock-kbd__key">2</div><div class="mock-kbd__key">3</div><div class="mock-kbd__key">4</div><div class="mock-kbd__key">5</div><div class="mock-kbd__key">6</div><div class="mock-kbd__key">7</div><div class="mock-kbd__key">8</div><div class="mock-kbd__key">9</div><div class="mock-kbd__key"></div><div class="mock-kbd__key">0</div><div class="mock-kbd__key">⌫</div></div>
    </section>
</div>

<script src="../../../../design-system/icons/icons.js"></script>
<script src="../feedback/messages.js"></script>
<script>
(() => {
  const root = document.querySelector('.signin-screen');
  const selector = document.getElementById('state');
  const input = document.getElementById('tm-login-mobile');
  const helper = document.getElementById('tm-login-helper');
  const field = root.querySelector('.tm-field');
  const submit = root.querySelector('.login-submit');
  const submitLabel = root.querySelector('.login-submit-label');
  const spinner = root.querySelector('.tm-spinner');
  const scroller = root.querySelector('.signin-scroll');
  const keyboard = root.querySelector('.mock-kbd');
  const M = window.TMFeedback.msg;
  document.getElementById('tm-login-sub').textContent = M('signin.subtitle');
  // Sign up: a real link (.tm-link: 48 hit area, no added height), D-101 o25 / D-108.
  const [before, after] = M('signin.signup', { link: '\u0001' }).split('\u0001');
  const signup = document.getElementById('tm-signup-option');
  const link = signup.querySelector('.login-signup-label');
  link.textContent = M('signin.signupLink');
  link.before(before); link.after(after || '');
  const NOTICES = { 'not-registered': 'signin.notRegistered', offline: 'signin.offline', 'couldnt-send': 'signin.couldntSend', 'too-many-tries': 'signin.tooMany', inactive: 'signin.inactive' };
  const states = {
    default: {number: '', helper: 'signin.smsHelper', error: false, keyboard: false, focused: false},
    'keyboard-open': {number: '98765', helper: 'signin.smsHelper', error: false, keyboard: true, focused: true},
    'empty-tap': {number: '', helper: 'signin.empty', error: true, keyboard: true, focused: false},
    'too-short': {number: '98765432', helper: 'signin.short', error: true, keyboard: true, focused: false},
    'wrong-first-digit': {number: '1234567890', helper: 'signin.prefix', error: true, keyboard: true, focused: false},
    'pasted-cleaned': {number: '9876543210', helper: 'signin.smsHelper', error: false, keyboard: true, focused: true},
    sending: {number: '9876543210', helper: 'signin.smsHelper', error: false, keyboard: true, focused: true},
    'not-registered': {number: '9876543210', notice: 'not-registered'},
    offline: {number: '9876543210', notice: 'offline'},
    'couldnt-send': {number: '9876543210', notice: 'couldnt-send'},
    'too-many-tries': {number: '9876543210', notice: 'too-many-tries'},
    inactive: {number: '9876543210', notice: 'inactive'}
  };
  function show(state) {
    const next = states[state] || states.default;
    state = states[state] ? state : 'default';
    root.dataset.state = state;
    root.dataset.keyboard = String(!!next.keyboard);
    keyboard.hidden = !next.keyboard;
    root.classList.toggle('has-error', !!next.error);
    root.classList.toggle('is-focused', !!next.focused && !next.error);
    selector.value = state;
    input.blur();
    input.value = next.number;
    input.readOnly = state === 'sending';
    helper.hidden = !!next.notice;
    helper.textContent = next.notice ? M('signin.smsHelper') : M(next.helper);
    Object.entries(NOTICES).forEach(([k, key]) => { const n = document.getElementById(`tm-login-${k}-notice`); n.hidden = next.notice !== k; n.lastElementChild.textContent = M(key); });
    input.setAttribute('aria-describedby', next.notice ? `tm-login-${next.notice}-notice` : 'tm-login-helper');
    submitLabel.textContent = state === 'sending' ? M('signin.submitSending') : state === 'too-many-tries' ? M('signin.submitWait', { time: '9:42' }) : state === 'inactive' ? M('signin.submitInactive') : M('signin.submitDefault');
    submit.setAttribute('aria-busy', String(state === 'sending'));
    submit.classList.toggle('tm-btn--busy', state === 'sending');
    spinner.hidden = state !== 'sending';
    submit.setAttribute('aria-disabled', String(state === 'sending' || state === 'too-many-tries'));
    submit.disabled = state === 'sending' || state === 'too-many-tries';
    field.classList.toggle('tm-field--error', !!next.error);
    input.setAttribute('aria-invalid', String(!!next.error));
    if (next.error) helper.setAttribute('role', 'alert'); else helper.removeAttribute('role');
    // The drawn keyboard acts as the phone's (F-05): Send OTP sits 16 clear above it (the screen scrolls on a short phone).
    scroller.scrollTop = 0;
    if (next.keyboard) requestAnimationFrame(() => {
      const d = submit.getBoundingClientRect().bottom + 16 - keyboard.getBoundingClientRect().top;
      if (d > 0) scroller.scrollTop += d;
    });
  }
  selector.addEventListener('change', () => show(selector.value));
  show(new URLSearchParams(location.search).get('capture') || 'default');
  if (window.TMIcons) window.TMIcons.render(root);
})();
</script>
</body>
</html>
