<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Truemeds for doctors — Welcome back</title>
<script>if(new URLSearchParams(location.search).has('capture'))document.documentElement.classList.add('capture')</script>
<link rel="stylesheet" href="../../../../design-system/truemeds.css">
<!-- 2026-11-11 (run r2-build, D-106–D-109): the approved reference uses the app's own screen styles, so the two can't drift:
     the one band and panel (D-107; the greeting may wrap, variant 2) and unlock's D-108 gaps (tile → 16 → caption).
     D-109 §3: the phone's prompt opens by itself once when the app opens here ("pending" is that moment); cancelling shows
     this screen as it is; the Unlock button stays for a retry. -->
<link rel="stylesheet" href="../../app/screens/band.css">
<link rel="stylesheet" href="../../app/screens/returning-unlock.css">
<style>
/* The reference page's own frame (not the screen): a 390 × 844 phone in review, the whole viewport in capture. */
html,body{margin:0}
[hidden]{display:none !important}   /* as the app shell (shell.css) */
body.tm{display:flex;flex-direction:column;align-items:center;background:var(--tm-surface-secondary)}
.screen{width:390px;height:844px;flex:none}
.review-controls{width:390px;margin:var(--tm-space-lg) auto;font-family:var(--tm-font);color:var(--tm-content-primary)}
.review-controls label{display:block;margin-bottom:var(--tm-space-xs)}
.review-controls select{width:100%;padding:var(--tm-space-sm);font:inherit;border:1px solid var(--tm-border-default);border-radius:var(--tm-radius-md);background:var(--tm-surface-primary)}
html.capture .review-controls{display:none}
html.capture body.tm{display:block;overflow:hidden;background:var(--tm-surface-primary)}
html.capture .screen{width:100vw;height:100vh}
</style>
<script src="../../../../design-system/icons/icons.js"></script>
<script src="../feedback/messages.js"></script>
</head><body class="tm">
<div class="review-controls"><label for="review-variant">Reference state</label><select id="review-variant" aria-label="Returning unlock state"><option value="fingerprint">Fingerprint</option><option value="face">Face ID</option><option value="screen-lock">Screen lock</option><option value="pending">Prompt open (on arrival, or after Unlock)</option><option value="cancelled">Prompt cancelled</option><option value="platform-retry">Phone shows its own retry</option><option value="unavailable">Not available on this phone</option></select></div>
<main class="screen unlock-screen tm" id="unlock-root">
 <header class="entry-band band">
  <div class="entry-band__row"><img class="entry-band__logo login-logo" src="../../brand/truemeds-for-doctors.svg" alt="truemeds for doctors"></div>
  <h1 class="entry-band__title" id="greeting"></h1>
  <p class="entry-band__sub sub" id="unlock-sub"></p>
 </header>
 <section class="entry-panel panel" aria-labelledby="ready">
  <div class="tm-notice tm-notice--neutral unlock-notice" id="unlock-notice" role="status" hidden><span class="tm-icon" data-icon="info-circle" aria-hidden="true"></span><span id="unlock-error"></span></div>
  <div class="prompt"><div class="prompt-icon" aria-hidden="true"><span class="tm-icon" id="variant-icon" data-icon="fingerprint"></span></div><h2 id="ready"></h2></div>
 </section>
 <div class="tm-actionbar footer">
  <button class="tm-btn tm-btn--primary tm-btn--lg tm-btn--block" id="unlock-action" type="button"><span id="unlock-label"></span></button>
  <button class="tm-btn tm-btn--quiet tm-btn--lg tm-btn--block" id="fallback" type="button"></button>
 </div>
</main>
<script>
const M=window.TMFeedback.msg;
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const variant=params.get('capture')||params.get('variant')||'fingerprint';
const ICON={fingerprint:'fingerprint','face':'face-id','screen-lock':'lock','pending':'fingerprint','cancelled':'fingerprint','platform-retry':'fingerprint','unavailable':'fingerprint'};
const LABEL={fingerprint:'unlock.submitFingerprint',face:'unlock.submitFace','screen-lock':'unlock.submitScreenLock'};
const sel=$('review-variant');
sel.value=variant in ICON?variant:'fingerprint';
sel.addEventListener('change',()=>{location.search='?variant='+sel.value});
// The doctor's name comes from mock profile data (D-92); the sample doctor is Dr. Kunal.
const greet=M('unlock.greeting',{name:'Kunal'});
$('unlock-root').setAttribute('aria-label',greet);
$('greeting').textContent=greet;
$('unlock-sub').textContent=M('unlock.subtitle');
$('ready').textContent=M('unlock.ready');
$('variant-icon').dataset.icon=ICON[sel.value];
const action=$('unlock-action'), fallback=$('fallback'), label=$('unlock-label');
label.textContent=M(LABEL[sel.value]||LABEL.fingerprint);
fallback.textContent=M('unlock.useOtp');
if(sel.value==='pending'){
 // L2: loading primary = brand fill, white label and spinner (central .tm-btn--busy)
 action.classList.add('tm-btn--busy');action.setAttribute('aria-busy','true');action.disabled=true;
 label.replaceChildren(Object.assign(document.createElement('span'),{className:'tm-spinner'}),M('unlock.submitBusy'));
}
if(sel.value==='unavailable'){
 // F2 notice; "Use OTP instead" is the single primary here (one primary per context). The biometric prompt is hidden so only the notice speaks.
 document.querySelector('.prompt').hidden=true;
 $('unlock-notice').hidden=false;
 $('unlock-error').textContent=M('unlock.unavailable');
 action.hidden=true;
 fallback.classList.remove('tm-btn--quiet');fallback.classList.add('tm-btn--primary');   // D-66 A1: the only way forward here, so primary
}
TMIcons.render(document);
</script>
</body></html>
